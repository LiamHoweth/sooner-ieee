name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Adapt internal links for project Pages
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const output = 'dist/client';
          const pages = ['index.html', 'about.html', 'events.html', 'projects.html', 'sponsors.html', '404.html'];

          for (const page of pages) {
            const file = path.join(output, page);
            if (!fs.existsSync(file)) continue;
            const html = fs.readFileSync(file, 'utf8')
              .replaceAll('href="/"', 'href="/sooner-ieee/"')
              .replace(/href="\/(about|events|projects|sponsors)"/g, 'href="/sooner-ieee/$1.html"');
            fs.writeFileSync(file, html);
          }
          NODE

      - name: Preserve framework asset directories
        run: |
          # Vinext mirrors assetPrefix in the output tree. GitHub Pages already
          # provides the /sooner-ieee URL prefix, so keep _next at artifact root.
          mv dist/client/sooner-ieee/_next dist/client/_next
          rmdir dist/client/sooner-ieee
          touch dist/client/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
